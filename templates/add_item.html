{% extends "base.html" %}

{% block title %}Post Item - Lost & Found Portal{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-card glass-panel">
        <div class="form-header">
            <h2>Post an Item</h2>
            <p>Fill in the details below. The more accurate, the better!</p>
        </div>
        
        <form method="POST" action="{{ url_for('add_item') }}" enctype="multipart/form-data" class="main-form">
            <div class="form-row">
                <div class="form-group half-width">
                    <label for="title">Item Title <span class="required">*</span></label>
                    <input type="text" id="title" name="title" required placeholder="E.g., Blue Dell Laptop">
                </div>
                
                <div class="form-group half-width">
                    <label for="status">Posting Type <span class="required">*</span></label>
                    <select id="status" name="status" required>
                        <option value="Lost">I Lost Something</option>
                        <option value="Found">I Found Something</option>
                    </select>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group half-width">
                    <label for="category">Category <span class="required">*</span></label>
                    <select id="category" name="category" required>
                        <option value="Electronics">Electronics</option>
                        <option value="Books">Books & Notes</option>
                        <option value="Accessories">Accessories & Wearables</option>
                        <option value="Others">Others</option>
                    </select>
                </div>
                <div class="form-group half-width">
                    <label for="location">Location <span class="required">*</span></label>
                    <input type="text" id="location" name="location" required placeholder="Where was it lost/found? (e.g., Library)">
                </div>
            </div>
            
            <div class="form-group">
                <label for="description">Detailed Description <span class="required">*</span></label>
                <textarea id="description" name="description" rows="4" required placeholder="Describe the item in detail. Mention any identifiable marks..."></textarea>
            </div>
            
            <div class="form-group">
                <label for="contact_info">Your Contact Info <span class="required">*</span></label>
                <input type="text" id="contact_info" name="contact_info" required placeholder="Phone number or specific instructions to meet">
            </div>
            
            <div class="form-group">
                <label for="image">Upload Image (Optional but recommended)</label>
                <div class="file-upload-wrapper">
                    <div class="file-upload-box">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <span>Click to browse</span>
                    </div>
                    <input type="file" id="image" name="image" accept=".jpg, .jpeg, .png" class="file-input">
                </div>
                <small class="form-text text-muted">Max file size: 5MB. Allowed formats: JPG, PNG.</small>
            </div>
            
            <div class="form-actions">
                <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary"><i class="fas fa-paper-plane"></i> Submit Post</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
